server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service worker and manifest — no cache (exact-match, highest priority)
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Backend-proxied paths. ^~ stops nginx from considering regex locations
  # below — without it, the *.jpg/.jpeg regex matches /uploads/foo.jpeg
  # and short-circuits to a 404 before this proxy rule runs.
  location ^~ /api/ {
    proxy_pass http://backend:3032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
  }
  location ^~ /uploads/ {
    proxy_pass http://backend:3032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Long-cache the bundled static assets (must come AFTER the ^~ proxy rules).
  location ~* \.(?:js|css|woff2?|svg|webp|jpg|jpeg|png|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
