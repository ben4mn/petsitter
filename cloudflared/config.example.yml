# Cloudflare Tunnel config for hanna.4mn.org → petsitter web container on :8084
#
# One-time setup on the server:
#   cloudflared tunnel login
#   cloudflared tunnel create petsitter
#   cloudflared tunnel route dns petsitter hanna.4mn.org
#
# Then copy this file to /etc/cloudflared/config.yml, replace the placeholders,
# and run:
#   sudo cloudflared service install
#   sudo systemctl enable --now cloudflared

tunnel: <YOUR_TUNNEL_UUID>
credentials-file: /root/.cloudflared/<YOUR_TUNNEL_UUID>.json

ingress:
  - hostname: hanna.4mn.org
    service: http://localhost:8084
  # Catch-all (required as the last rule)
  - service: http_status:404
